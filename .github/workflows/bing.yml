# Bing 數據同步機器人：每天抓 annahouse.tw 的 Bing 搜尋數據，送進皮皮後台（crm-api）
# Bing 會擋 Cloudflare 的網路，所以由 GitHub 這邊代抓；資料不存進這個專案
# 每天台灣時間早上 7 點執行，也可以到「Actions」頁面按「Run workflow」手動執行
name: Bing 數據同步

on:
  schedule:
    - cron: '0 23 * * *'   # UTC 23:00＝台灣隔天 07:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 抓 Bing 數據並送進皮皮後台
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          BING_INGEST_TOKEN: ${{ secrets.BING_INGEST_TOKEN }}
        run: python tools/bing_sync.py
